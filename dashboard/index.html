<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veg Anna Show</title>
    <!-- ResponsiveVoice Audio Engine to guarantee voice output on Android WebViews -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        #header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #chat-container { flex: 1; overflow-y: auto; background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 6px; max-width: 80%; }
        .user-msg { background: #007bff; align-self: flex-end; margin-left: auto; }
        .veganna-msg { background: #333; align-self: flex-start; }
        #controls { display: flex; gap: 10px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #clear-btn { background: #ff4444; }
    </style>
</head>
<body>

    <div id="header">
        <h2>Veg Anna Show</h2>
        <button id="clear-btn" onclick="clearChat()">Clear Chat</button>
    </div>

    <div id="chat-container">
        <!-- Chat messages will render here -->
    </div>

    <div id="controls">
        <button id="mic-btn" onclick="toggleMic()">🎤 Speak to VegAnna</button>
    </div>

    <script>
        // 1. Polyfill window.speechSynthesis to route through ResponsiveVoice (US English Female)
        window.speechSynthesis = window.speechSynthesis || {};
        window.speechSynthesis.cancel = function() {
            if (window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') {
                window.responsiveVoice.cancel();
            }
        };
        window.speechSynthesis.speak = function(utterance) {
            if (window.responsiveVoice) {
                window.responsiveVoice.speak(utterance.text, "US English Female");
            }
        };

        // 2. Function to trigger VegAnna's voice output when her reply arrives
        function speakVegAnnaReply(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[*_#`~]/g, ''); // Clean markdown formatting for smooth reading
            const utterance = { text: cleanText };
            window.speechSynthesis.speak(utterance);
        }

        // 3. Clear Chat Function (Wipes screen and storage to stop infinite growth)
        function clearChat() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            document.getElementById('chat-container').innerHTML = '';
            localStorage.removeItem('chat_history');
            localStorage.removeItem('veganna_messages');
        }

        // Example trigger hook: Whenever VegAnna's text reply is added to the screen, call speakVegAnnaReply(replyText);
    </script>
</body>
</html>
