<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veg Anna Show - Live Dashboard</title>
    <!-- ResponsiveVoice Audio Engine for Android WebView TTS -->
    <script src="https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f11;
            color: #f0f0f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #18181b;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #27272a;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ec4899;
            letter-spacing: 0.5px;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-clear {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-clear:hover { background-color: #dc2626; }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #09090b;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .user-msg {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .veganna-msg {
            background-color: #27272a;
            color: #f4f4f5;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #3f3f46;
        }
        .input-panel {
            background-color: #18181b;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            border-top: 1px solid #27272a;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 8px;
            padding: 12px 16px;
            color: white;
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #ec4899;
        }
        .btn-action {
            background-color: #ec4899;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-action:hover { background-color: #db2777; }
        .mic-active { background-color: #10b981 !important; }
    </style>
</head>
<body>

    <header>
        <h1>Veg Anna Show</h1>
        <div class="header-actions">
            <button class="btn-clear" onclick="clearChatHistory()">Clear Chat</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message veganna-msg">
            Hello! I am VegAnna. Your audio input and US English female voice output are locked and ready. Type or speak below!
        </div>
    </div>

    <div class="input-panel">
        <input type="text" id="user-input" placeholder="Type your message or tap mic..." onkeydown="if(event.key==='Enter') sendMessage();">
        <button class="btn-action" id="mic-btn" onclick="toggleSpeechInput()">🎤 Mic</button>
        <button class="btn-action" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // --- 1. AUDIO OUTPUT SETUP (ResponsiveVoice US English Female) ---
        window.speechSynthesis = window.speechSynthesis || {};
        window.speechSynthesis.cancel = function() {
            if (window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') {
                window.responsiveVoice.cancel();
            }
        };
        window.speechSynthesis.speak = function(utterance) {
            if (window.responsiveVoice) {
                window.responsiveVoice.speak(utterance.text, "US English Female");
            }
        };

        function speakVegAnnaReply(text) {
            if (!text) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/[*_#`~]/g, ''); // Strip markdown for clean speech
            window.speechSynthesis.speak({ text: cleanText });
        }

        // --- 2. CLEAR CHAT FUNCTION (Wipes screen, stops audio, clears bloat) ---
        function clearChatHistory() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            const chatBox = document.getElementById('chat-container');
            if (chatBox) {
                chatBox.innerHTML = '<div class="message veganna-msg">Chat cleared. Ready for a new session!</div>';
            }
            localStorage.removeItem('veganna_chat_history');
        }

        // --- 3. CHAT & MESSAGE MANAGEMENT (Prevents infinite HTML bloat) ---
        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender === 'user' ? 'user-msg' : 'veganna-msg'}`;
            msgDiv.textContent = text;
            chatBox.appendChild(msgDiv);
            
            // Keep history trimmed to prevent DOM/storage bloat (max 50 messages)
            while (chatBox.children.length > 50) {
                chatBox.removeChild(chatBox.firstChild);
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            // Simulated VegAnna Response (Replace with your actual backend / API call logic)
            setTimeout(() => {
                const reply = "I hear you loud and clear! This response is streaming with our US English female voice.";
                appendMessage('veganna', reply);
                speakVegAnnaReply(reply);
            }, 500);
        }

        // --- 4. SPEECH-TO-TEXT (Locked & Functional) ---
        let recognition = null;
        let isListening = false;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendMessage();
            };

            recognition.onend = function() {
                isListening = false;
                document.getElementById('mic-btn').classList.remove('mic-active');
            };
        }

        function toggleSpeechInput() {
            if (!recognition) {
                alert("Speech recognition is not supported in this browser wrapper.");
                return;
            }
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                document.getElementById('mic-btn').classList.add('mic-active');
            }
        }
    </script>
</body>
</html>
