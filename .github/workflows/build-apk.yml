name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Webview Project with Real Icons, Debugging & Full Audio/Mic Support
        run: |
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/res/mipmap-mdpi
          mkdir -p android-project/app/src/main/res/mipmap-hdpi
          mkdir -p android-project/app/src/main/res/mipmap-xhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-project/app/src/main/res/mipmap-xxxhdpi
          
          # Copy repository web files into Android assets directory
          cp -r dashboard assets icons index.html manifest.json android-project/app/src/main/assets/ 2>/dev/null || true
          cp -r * android-project/app/src/main/assets/ 2>/dev/null || true

          # Find and copy user's actual icon into all Android mipmap densities for real launcher icon
          ICON_PATH=""
          if [ -f "icons/icon-512x512.png" ]; then
            ICON_PATH="icons/icon-512x512.png"
          elif [ -f "dashboard/icons/icon-512x512.png" ]; then
            ICON_PATH="dashboard/icons/icon-512x512.png"
          fi

          if [ -n "$ICON_PATH" ]; then
            cp "$ICON_PATH" android-project/app/src/main/res/mipmap-mdpi/ic_launcher.png
            cp "$ICON_PATH" android-project/app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp "$ICON_PATH" android-project/app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp "$ICON_PATH" android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp "$ICON_PATH" android-project/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          else
            # Fallback placeholder if no icon file is found
            convert -size 512x512 xc:black android-project/app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
          fi

          # Create root settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = "VegAnnaShow"
          include ':app'
          EOF

          # Create root build.gradle
          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create app build.gradle
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.veganna.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.veganna.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Create AndroidManifest.xml with Microphone & Hardware Permissions
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.BLUETOOTH" />
              
              <application
                  android:allowBackup="true"
                  android:label="Veg Anna Show"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity Java wrapper with Remote Debugging & Media Support
          mkdir -p android-project/app/src/main/java/com/veganna/app
          cat << 'EOF' > android-project/app/src/main/java/com/veganna/app/MainActivity.java
          package com.veganna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Request microphone permission at runtime on Android 6+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 100);
                      }
                  }

                  // Enable remote debugging so you can inspect console errors via chrome://inspect
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMediaPlaybackRequiresUserGesture(false); // Allow audio/speech autoplay
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());
                  
                  // Grant microphone and audio recording permissions inside the WebView wrapper
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  webView.loadUrl("file:///android_asset/dashboard/index.html");
                  setContentView(webView);
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android-project
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VegAnnaShow-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
