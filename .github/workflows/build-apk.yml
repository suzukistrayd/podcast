name: Generate Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Build Webview APK via Gradle
        run: |
          # Clones standard Android TWA shell template
          git clone https://github.com/GoogleChrome/android-browser-helper.git twa-shell
          cd twa-shell/demos/twa-basic
          
          # Inject Kunda Cafe PWA configuration
          cat <<EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="appName">Veg Anna Show</string>
              <string name="hostName">suzukistrayd.github.io</string>
              <string name="launchUrl">/podcast/dashboard/</string>
          </resources>
          EOF
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KundaCafe-VegAnna-APK
          path: twa-shell/demos/twa-basic/app/build/outputs/apk/debug/app-debug.apk
