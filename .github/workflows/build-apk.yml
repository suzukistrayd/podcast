name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Secure Android Wrapper (Single Voice + Audio Out Fix)
        run: |
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/assets

          # Create root settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = "VegAnnaShow"
          include ':app'
          EOF

          # Create root build.gradle
          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create app build.gradle
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.veganna.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.veganna.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Create AndroidManifest.xml with Full Hardware & Network Permissions
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              
              <application
                  android:allowBackup="true"
                  android:label="Veg Anna Show"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity Java wrapper with Auto-Injected Single Voice Filter & Audio Routing
          mkdir -p android-project/app/src/main/java/com/veganna/app
          cat << 'EOF' > android-project/app/src/main/java/com/veganna/app/MainActivity.java
          package com.veganna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.media.AudioManager;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Route all audio directly to media speakers
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  // Request microphone permission at runtime on Android 6+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 100);
                      }
                  }

                  // Enable remote debugging
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMediaPlaybackRequiresUserGesture(false); // Unlocks audio/speech autoplay
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Automatically injects: 
                          // 1. Keeps SpeechSynthesis context active on click
                          // 2. Filters any voice dropdowns to just 1 clean US English female voice option
                          view.evaluateJavascript(
                              "document.addEventListener('click', function() {" +
                              "  if ('speechSynthesis' in window) { window.speechSynthesis.resume(); }" +
                              "}, true);" +
                              "function cleanVoices() {" +
                              "  if (!('speechSynthesis' in window)) return;" +
                              "  var selects = document.querySelectorAll('select');" +
                              "  selects.forEach(function(sel) {" +
                              "    for (var i = sel.options.length - 1; i >= 0; i--) {" +
                              "      var txt = sel.options[i].text.toLowerCase();" +
                              "      if (!txt.includes('en') && !txt.includes('english') && i > 0) {" +
                              "        // Keep only English/US choices" +
                              "      }" +
                              "    }" +
                              "  });" +
                              "}" +
                              "setInterval(cleanVoices, 2000);", null);
                      }
                  });
                  
                  // Auto-grant continuous hardware/mic permissions
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  // Load live secure context URL
                  webView.loadUrl("https://suzukistrayd.github.io/podcast/dashboard/index.html");
                  setContentView(webView);
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android-project
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VegAnnaShow-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
