name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android Wrapper (Audio Output + Injected Clear Chat Button)
        run: |
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/layout
          mkdir -p android-project/app/src/main/assets

          # Create root settings.gradle
          cat << 'EOF' > android-project/settings.gradle
          rootProject.name = "VegAnnaShow"
          include ':app'
          EOF

          # Create root build.gradle
          cat << 'EOF' > android-project/build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          # Create app build.gradle
          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.veganna.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.veganna.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # Create AndroidManifest.xml with Audio Hardware Permissions
          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              
              <application
                  android:allowBackup="true"
                  android:label="Veg Anna Show"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity Java wrapper with Injected Voice Engine & Clear Chat Controls
          mkdir -p android-project/app/src/main/java/com/veganna/app
          cat << 'EOF' > android-project/app/src/main/java/com/veganna/app/MainActivity.java
          package com.veganna.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.PermissionRequest;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.media.AudioManager;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Route audio directly to main phone media speakers
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  // Request microphone permission at runtime
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 100);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                      WebView.setWebContentsDebuggingEnabled(true);
                  }

                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setMediaPlaybackRequiresUserGesture(false); // Unlocks HTML5 audio playback
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          
                          // Inject ResponsiveVoice TTS engine & Clear Chat UI dynamically into the web page
                          view.evaluateJavascript(
                              "(function() {" +
                              "  if (!document.getElementById('rv-script')) {" +
                              "    var script = document.createElement('script');" +
                              "    script.id = 'rv-script';" +
                              "    script.src = 'https://code.responsivevoice.org/responsivevoice.js?key=FREE_KEY';" +
                              "    document.head.appendChild(script);" +
                              "  }" +
                              "  window.speechSynthesis = window.speechSynthesis || {};" +
                              "  window.speechSynthesis.cancel = function() { if(window.responsiveVoice && typeof window.responsiveVoice.cancel === 'function') { window.responsiveVoice.cancel(); } };" +
                              "  window.speechSynthesis.resume = function() {};" +
                              "  window.speechSynthesis.speak = function(utterance) {" +
                              "    if (window.responsiveVoice) {" +
                              "      window.responsiveVoice.speak(utterance.text, 'US English Female');" +
                              "    }" +
                              "  };" +
                              "  if (!document.getElementById('injected-clear-btn')) {" +
                              "    var btn = document.createElement('button');" +
                              "    btn.id = 'injected-clear-btn';" +
                              "    btn.innerText = 'Clear Chat';" +
                              "    btn.style.position = 'fixed';" +
                              "    btn.style.top = '10px';" +
                              "    btn.style.right = '10px';" +
                              "    btn.style.zIndex = '99999';" +
                              "    btn.style.backgroundColor = '#ff4444';" +
                              "    btn.style.color = '#ffffff';" +
                              "    btn.style.border = 'none';" +
                              "    btn.style.padding = '8px 14px';" +
                              "    btn.style.borderRadius = '20px';" +
                              "    btn.style.fontWeight = 'bold';" +
                              "    btn.style.boxShadow = '0px 2px 5px rgba(0,0,0,0.3)';" +
                              "    btn.onclick = function() {" +
                              "      if (window.speechSynthesis) window.speechSynthesis.cancel();" +
                              "      var containers = document.querySelectorAll('#chat-container, #chat-box, .chat-messages, .messages');" +
                              "      containers.forEach(function(c) { c.innerHTML = ''; });" +
                              "      localStorage.clear();" +
                              "    };" +
                              "    document.body.appendChild(btn);" +
                              "  }" +
                              "})();", null);
                      }
                  });
                  
                  // Auto-grant continuous microphone and media hardware permissions
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override
                              public void run() {
                                  request.grant(request.getResources());
                              }
                          });
                      }
                  });

                  // Load live HTTPS secure context
                  webView.loadUrl("https://suzukistrayd.github.io/podcast/dashboard/index.html");
                  setContentView(webView);
              }
          }
          EOF

      - name: Build APK with Gradle
        run: |
          cd android-project
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VegAnnaShow-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
