name: Generate Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: PWABuilder Android Action
        uses: pwa-builder/pwa-action@v1.0.1
        with:
          manifest-url: 'https://suzukistrayd.github.io/podcast/dashboard/manifest.json'
          output-type: 'apk'

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KundaCafe-VegAnna-APK
          path: '*.apk'
