<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE VEG ANNA SHOW // KUNDA CAFE // CHIANG RAI</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="shortcut icon" type="image/png" href="./favicon.png">
    <meta name="theme-color" content="#d97706">

    <!-- GOOGLE FONTS: ULTRA FAT SYNE & BLACK INTER -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #050505;
            --surface: rgba(17, 17, 17, 0.85);
            --surface-border: #333333;
            --accent: #d97706;
            --accent-glow: rgba(217, 119, 6, 0.5);
            --text-main: #ffffff;
            --text-muted: #d1d5db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            overflow-x: hidden;
            line-height: 1.4;
        }

        /* INFINITE TICKER TOP BANNER */
        .infinite-ticker {
            background: var(--accent);
            color: #000000;
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 0;
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            position: relative;
            z-index: 10;
        }

        .ticker-track {
            display: flex;
            gap: 50px;
            animation: scrollTicker 20s linear infinite;
        }

        .ticker-item {
            display: flex;
            align-items: center;
            gap: 50px;
        }

        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* FULL-SCREEN HERO CONTAINER */
        header {
            position: relative !important;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            overflow: hidden;
            background-color: #050505;
        }

        /* FULL-SCREEN BACKGROUND IMAGE (MOBILE LEFT-CENTER / DESKTOP TOP-CENTER) */
        .hero-bg-img {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            object-position: 25% center !important;
            z-index: 1 !important;
            filter: brightness(0.55) contrast(1.1);
            display: block !important;
        }

        @media (min-width: 768px) {
            .hero-bg-img {
                object-position: center top !important;
            }
        }

        /* DARK GRADIENT OVERLAY FOR READABILITY */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(5,5,5,0.4) 0%, rgba(5,5,5,0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 3;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(3.2rem, 8vw, 7.5rem);
            font-weight: 800;
            line-height: 0.92;
            text-transform: uppercase;
            margin-bottom: 24px;
            letter-spacing: -2px;
            text-shadow: 0 4px 30px rgba(0,0,0,0.9);
        }

        h1 span {
            color: var(--accent);
            display: block;
        }

        .hero-subtitle {
            font-size: clamp(1rem, 2.2vw, 1.35rem);
            color: var(--text-muted);
            max-width: 700px;
            margin-bottom: 40px;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
        }

        /* BUTTONS */
        .cta-group {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 17px;
            padding: 18px 36px;
            border-radius: 10px;
            text-decoration: none;
            text-transform: uppercase;
            transition: transform 0.2s ease, background 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000000;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            background: #f59e0b;
        }

        .btn-secondary {
            background: rgba(20, 20, 20, 0.9);
            color: var(--text-main);
            border: 2px solid var(--surface-border);
        }

        .btn-secondary:hover {
            border-color: var(--accent);
        }

        /* CONTAINER & KUNDA INFO SECTIONS */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 20px;
            position: relative;
            z-index: 3;
        }

        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            text-transform: uppercase;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -1px;
        }

        .section-title span {
            color: var(--accent);
        }

        .kunda-info-box {
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 60px;
            box-shadow: 0 0 30px rgba(217,119,6,0.15);
            backdrop-filter: blur(10px);
        }

        .kunda-info-box h3 {
            font-family: 'Syne', sans-serif;
            font-size: 2rem;
            color: var(--accent);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .kunda-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .kunda-fact {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
        }

        .kunda-fact strong {
            color: var(--accent);
            display: block;
            margin-bottom: 6px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .kunda-fact span {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 900;
        }

        /* GUIDES GRID */
        .guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 60px;
        }

        .guide-card {
            background: var(--surface);
            border: 2px solid var(--surface-border);
            border-radius: 16px;
            padding: 36px;
            transition: border-color 0.2s;
            backdrop-filter: blur(10px);
        }

        .guide-card:hover {
            border-color: var(--accent);
        }

        .card-number {
            font-family: 'Syne', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 16px;
        }

        .guide-card h4 {
