<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Anna 01 - JUV Telemetry & Latency Core</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LEFT HUD PANE -->
    <div class="agent-hud-pane">
        <div class="agent-header-meta">
            <span class="agent-id-badge" id="agent-id-display">ID: AGENT-ANNA-01</span>
            <div class="status-bar-indicator" id="status-bar">
                <div class="status-dot"></div>
                <span id="state-text">READY</span>
            </div>
        </div>

        <div class="agent-visual-container">
            <canvas id="wav-canvas"></canvas>

            <div class="agent-portrait-frame">
                <img id="agent-avatar-img" 
                     src="character/agent-anna.png" 
                     onerror="this.onerror=null; this.src='https://images.squarespace-cdn.com/content/v1/55db4cd3e4b0300a610091bb/e3cf3515-cbfc-44d5-9418-045b7ff396ca/How-to-look-a-decade-younger-without-surgery-by-siti-med-spa-san-diego.jpg';" 
                     alt="Agent Anna Portrait">
            </div>
            
            <div class="agent-nameplate">
                <h2 id="agent-title">AA01 // CORE</h2>
                <p>Autonomous Telemetry & Voice Unit</p>
            </div>

            <div class="eq-container">
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
                <div class="eq-bar"></div>
            </div>
        </div>
    </div>

    <!-- RIGHT CHAT CONSOLE -->
    <div class="chat-console-pane">
        <div class="chat-header">
            <span>CONSOLE [JUV NEURAL]</span>
            <span id="latency-display" class="latency-badge">TRIP LATENCY: 0.00s</span>
            <div style="display: flex; gap: 6px;">
                <button class="ctrl-btn" onclick="clearLogs()" title="Clear Logs">🧹</button>
                <button class="ctrl-btn active" id="voice-btn" onclick="toggleVoice()">🔊 ON</button>
                <button class="ctrl-btn" onclick="toggleSettings()">⚙️ KEYS</button>
            </div>
        </div>

        <!-- TACTICAL TASK BAR -->
        <div class="quick-launch-bar">
            <span class="quick-launch-label">TACTICAL:</span>
            <button class="ctrl-btn" onclick="launchLocalServer()" title="Launch Python HTTP Server & Open Browser">🚀 START SERVER</button>
            <button class="ctrl-btn" onclick="triggerManualTelemetry()" title="Fetch Live Market Tickers">📊 CRYPTO MARKET</button>
            <button class="ctrl-btn" onclick="scrapeWebPage()" title="Scrape First 100 Lines from URL">🌐 SCRAPE WEB</button>
            <button class="ctrl-btn military-btn" onclick="triggerMilitaryProtocol()" title="Advanced Military Trigger">⚡ PROTOCOL</button>
        </div>

        <div id="settings-panel">
            <input type="password" id="api-key" placeholder="Enter Dahl API Key" style="width: 100%; padding: 8px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); font-family: monospace; font-size: 12px; border-radius: 4px; margin-bottom: 8px;" onchange="saveKey()">
        </div>

        <div class="thinking-banner" id="thinking-banner">
            [AA01 NEURAL MATRIX ACTIVE — STREAMING...]
        </div>

        <div id="chat-container">
            <div class="message assistant">
                <div class="msg-header">AA01 Core</div>
                <div class="msg-body">Modular decoupled architecture active. Linked to style.css, scrape.js, and app.js. Ready for command.</div>
            </div>
        </div>

        <div class="input-control-bar">
            <button class="ctrl-btn" id="mic-btn" onclick="toggleMic()" title="Toggle Microphone">🎤</button>
            <input type="text" id="user-input" placeholder="Enter target URL (e.g., https://strayd.com) or query telemetry..." onkeydown="handleKey(event)">
            <button class="ctrl-btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <!-- LINKED MODULES -->
    <script src="scrape.js"></script>
    <script src="app.js"></script>
</body>
</html>
