<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Anna 01 - JUV Telemetry & Latency Core</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    
    <!-- Dynamic Asset Path Resolver for Local & GitHub Pages Parity -->
    <script>
        const isGitHub = window.location.hostname.includes('github.io');
        const basePath = isGitHub ? '/podcast/' : './';
        
        // Inject Stylesheet dynamically
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = basePath + 'styles.css';
        document.head.appendChild(link);
    </script>
</head>
<body>

    <div id="status-bar">
        <span id="state-text">READY</span>
        <div class="eq-container">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>AA01 // CORE</h1>
            <p>Autonomous Telemetry & Voice Unit</p>
        </header>

        <div class="toolbar">
            <button id="voice-btn" class="ctrl-btn active" onclick="toggleVoice()">🔊 ON</button>
            <button class="ctrl-btn" onclick="toggleSettings()">⚙️ KEYS</button>
            <button class="ctrl-btn" onclick="clearLogs()">🧹 CLEAR</button>
            <span id="latency-display" style="font-family: monospace; font-size: 11px; color: #8493a8; margin-left: auto;">TRIP LATENCY: 0.00s</span>
        </div>

        <div id="settings-panel" style="display:none; margin-bottom: 12px; padding: 10px; background: #0b132b; border: 1px solid #1b263b; border-radius: 4px;">
            <label style="font-family: monospace; font-size: 11px; color: #00ffcc; display: block; margin-bottom: 4px;">DAHL API KEY:</label>
            <input type="password" id="api-key" placeholder="sk-..." style="width: 100%; padding: 6px; background: #030712; border: 1px solid #1b263b; color: #fff; font-family: monospace; border-radius: 3px;" oninput="saveKey()">
        </div>

        <div class="action-bar">
            <span style="font-family: monospace; font-size: 11px; color: #8493a8; align-self: center;">TACTICAL:</span>
            <button class="action-btn" onclick="launchLocalServer()">🚀 START SERVER</button>
            <button class="action-btn" onclick="triggerManualTelemetry()">📊 CRYPTO MARKET</button>
            <button class="action-btn" onclick="scrapeWebPage()">🌐 SCRAPE WEB</button>
            <button class="action-btn" onclick="triggerMilitaryProtocol()">⚡ PROTOCOL</button>
        </div>

        <div class="terminal-box">
            <div id="chat-container">
                <div class="message assistant">
                    <div class="msg-header">AA01 Core</div>
                    <div class="msg-body">[AA01 NEURAL MATRIX ACTIVE — STREAMING...]</div>
                </div>
            </div>

            <!-- Central Audio Visualizer Canvas -->
            <div style="width: 100%; height: 40px; background: #030712; border-top: 1px solid #1b263b; position: relative; overflow: hidden;">
                <canvas id="wav-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
            </div>

            <div class="input-panel">
                <button id="mic-btn" class="mic-btn" onclick="toggleMic()" title="Voice Input">🎙️</button>
                <input type="text" id="user-input" placeholder="Enter target URL (e.g., https...) or prompt..." onkeydown="handleKey(event)">
                <button onclick="sendMessage()">SEND</button>
            </div>
        </div>
    </div>

    <!-- Dynamic Script Loader for Local & GitHub Pages Parity -->
    <script>
        const isGH = window.location.hostname.includes('github.io');
        const rootPath = isGH ? '/podcast/' : './';
        
        const script = document.createElement('script');
        script.src = rootPath + 'app.js';
        document.body.appendChild(script);
    </script>
</body>
</html>
